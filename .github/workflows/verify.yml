name: Verify Beyond
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: signal
          POSTGRES_DB: signal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signal -d signal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend tests
      - run: uv run pytest -q
      - name: PostgreSQL repository and publication checks
        run: uv run pytest tests/integration tests/unit/test_report.py tests/unit/test_llm_failover.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://signal:signal@127.0.0.1:5432/signal_test
      - name: Migrate PostgreSQL schema
        run: uv run alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://signal:signal@127.0.0.1:5432/signal_test
      - run: uv run signal-research evaluate --offline
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
