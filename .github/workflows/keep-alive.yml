name: Keep Beyond awake

on:
  schedule:
    # Avoid the start of the hour, when GitHub schedules are busiest.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-alive.yml'

permissions: {}

concurrency:
  group: beyond-keep-alive
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the public web service without querying Neon
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            https://beyond-gtg4.onrender.com/api/v1/health/live
