name: Check Beyond health manually

on:
  # Recurring checks run in Neon's beyondkeepalive scheduled Function Trigger.
  # Keep this workflow available only as a manual diagnostic fallback.
  workflow_dispatch:

permissions: {}

concurrency:
  group: beyond-keep-alive
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the public web service without querying Neon
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            https://beyond-gtg4.onrender.com/api/v1/health/live
