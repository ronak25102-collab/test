  exact_passage: "PRESS RELEASE\r\nFriday, 23\r\nrd January, 2026, Mumbai : The Board\
    \ Meeting of Shriram Finance Limited (SFL) was held today \r\nto consider the\
    \ unaudited financial results for the third quarter ended 31\r\nst December, 2025.\r\
    \nFinancials (Standalone) : \r\nThird quarter ended 31\r\nst December, 2025 :\r\
    \nThe Net Interest Income for the third quarter ended 31\r\nst December, 2025\
    \ increased by 16.17% and stood at\r\nRs. 6,764.09 crores as against Rs 5,822.69\
    \ crores in the same period of the previous year. The profit after \r\ntax increased\
    \ by 21.21% and stands at Rs. 2,521.67 crores as against Rs. 2,080.37 crores (excluding\
    \ one \r\ntime gain of Rs. 1,489.39 crores for sale of our stake in subsidiary\
    \ Shriram Housing Finance Limited\r\nhereinafter referred as “exceptional gain”)\
    \ in the same period of the previous year. However, the profit after \r\ntax decreased\
    \ by 29.36% and stands at Rs. 2,521.67 crores as against Rs. 3,569.76 crores (excluding\
    \ \r\nexceptional gain) recorded in the same period of the previous year. The\
    \ earning per share (basic) increased \r\nby 21.05% and stands at Rs. 13.40 as\
    \ against Rs. 11.07 (excluding exceptional gain) recorded in the same \r\nperiod\
    \ of the previous year. However, the earning per share (basic) decreased by 29.44%\
    \ and stands at Rs. \r\n13.40 as against Rs. 18.99 (including exceptional gain)\
    \ recorded in the same period of the previous year.\r\nFinancials (Standalone)\
    \ : \r\nNine months ended 31st December, 2025 :\r\nThe Net Interest Income for\
    \ the nine months ended 31st December, 2025 increased by 13.55% and stood at\r\
    \nRs. 19,057.36 crores as against Rs 16,783.90 crores in the same period of the\
    \ previous year. The profit after \r\ntax increased by 13.90% and stands at Rs.\
    \ 6,984.58 crores as against Rs. 6,132.22 crores (excluding \r\nexceptional gain)\
    \ in the same period of the previous year. However, the profit after tax decreased\
    \ by 8.36% \r\nand stands at Rs. 6,984.58 crores as against Rs. 7,621.61 crores\
    \ (including exceptional item) recorded in \r\nthe same period of the previous\
    \ year. The earning per share (basic) increased by 13.86% and stands at Rs. \r\
    \n37.14 as against Rs. 32.62 (excluding exceptional gain) recorded in the same\
    \ period of the previous year.\r\nHowever, The earning per share (basic) decreased\
    \ by 8.41% and stands at Rs. 37.14 as against Rs. 40.55\r\n(including exceptional\
    \ gain) recorded in the same period of the previous year.\r\nContd ……2/-"
