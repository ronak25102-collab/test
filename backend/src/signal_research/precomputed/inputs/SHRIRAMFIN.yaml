  - id: f172582c-b75b-5e56-ade1-72fd135c2ff7
    document_id: e8939fcf-63e7-58d7-af0a-1a4537e46772
    page_index: 1
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "(2) \r\n \r\nFinancials (Consolidated) : \r\nFourth quarter ended 31st\
      \ March, 2023 : \r\nConsolidated Net Interest Income for the fourth quarter\
      \ ended 31st March, 2023 stood at Rs. 4,533.63 crores \r\nas against Rs. 2,627.82\
      \ crores in the same period last year. Consolidated Net Profit stands at Rs.\
      \ 1,288.18 \r\ncrores as against Rs.1091.23 crores recorded in the same period\
      \ of the previous year. Consolidated EPS \r\n(basic) was Rs. 34.01 as compared\
      \ to Rs. 40.34 recorded in the same period of the previous year .\r\nFinancial\
      \ Year ended 31st \r\n March, 2023 : \r\nConsolidated Net Interest Income for\
      \ the year ended 31st March, 2023 stood at Rs. 17,272.45 crores as \r\nagainst\
      \ Rs. 9316.06 crores for the year ended 31st March, 2022. Consolidated profit\
      \ after tax stands at Rs. \r\n6,020.03 crores as against Rs. 2,721.10 crores\
      \ recorded in the previous year. Consolidated EPS (basic) for \r\nthe year ended\
      \ 31st March, 2023 was Rs. 160.54 as compared to Rs. 102.23 recorded in the\
      \ previous year. \r\n \r\nAssets under Management : \r\nTotal Assets under Management\
      \ as on 31st March, 2023 stood at Rs. 1,93,729.46 crores as compared to \r\n\
      Rs.1,27,040.86 crores as on 31st March, 2022 and Rs. 1,84,676.18 crores as on\
      \ 31st December, 2022. \r\n \r\nAbout Shriram Finance Limited.\r\nShriram Finance\
      \ Limited is the flagship company of the Shriram group which has significant\
      \ presence in \r\nConsumer Finance, Life Insurance, General Insurance, Housing\
      \ Finance, Stock Broking and Distribution \r\nbusinesses. Shriram Finance Limited\
      \ is India’s largest retail asset financing Non-Banking Finance Company \r\n\
      (NBFC) with Assets under Management (AUM) of Rs. 1.85 trillion. Shriram City\
      \ Union Finance Limited and \r\nShriram Capital Limited were amalgamated with\
      \ Shriram Transport Finance Company Limited and the \r\nname of Shriram Transport\
      \ Finance Company Limited has been changed to Shriram Finance Limited with \r\
      \neffect from November 30, 2022. Established in 1979, Shriram Finance is holistic\
      \ finance provider catering to \r\nthe needs of Small Road Transport Operators\
      \ and small business owners and is a leader in organised \r\nfinancing of pre-owned\
      \ commercial vehicles and two wheelers. It has vertically integrated business\
      \ model \r\nand offers financing number of products which include passenger\
      \ commercial vehicles, loans to micro and \r\nsmall and medium enterprises (MSMEs),\
      \ tractors & farm equipment, gold, personal loans and working capital \r\nloans\
      \ etc. Over last 44 years, it has developed strong competencies in the areas\
      \ of loan origination, valuation \r\nof pre-owned commercial vehicles and other\
      \ assets, and collections. It has a pan India presence with \r\nnetwork of over\
      \ 2,922 outlets and an employee strength of more than 64,052 servicing over\
      \ 73.24 lakhs of \r\ncustomers.\r\nFor Further information, please contact:\
      \ \r\nSanjay K. Mundra\r\nPresident \r\nShriram Finance Limited \r\n+91 22 40959507,\
      \ smundra@shriramfinance.in"
