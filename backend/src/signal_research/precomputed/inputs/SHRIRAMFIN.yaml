  page_number: 1
  exact_passage: "Friday 26th. April, 2024, Mumbai : The Board Meeting of Shriram\
    \ Finance Limited (SFL) (Formerly known as \r\nShriram Transport Finance Company\
    \ Limited STFC)) was held today to consider the audited financial results \r\n\
    for the fourth quarter and the year ended 31st March, 2024. \r\n \r\nFinancials\
    \ (Standalone) : \r\nFourth quarter ended 31st \r\n March, 2024 : \r\nThe Net\
    \ Interest Income for the fourth quarter ended 31st March, 2024 increased by 20.02%\
    \ and stood at Rs.\r\n5,336.06 crores as against Rs. 4,445.89 crores in the same\
    \ period of the previous year. The profit after tax \r\nincreased by 48.73% and\
    \ stands at Rs. 1,945.87 crores as against Rs. 1,308.31 crores recorded in the\
    \ same \r\nperiod of the previous year. The earning per share (basic) increased\
    \ by 48.23% and was Rs. 51.79 as \r\nagainst Rs. 34.94 recorded in the same period\
    \ of the previous year.\r\n \r\nFinancial Year ended 31st\r\n March, 2024 : \r\
    \nThe Net Interest Income for the year ended 31st March, 2024 increased by 16.06\
    \ % and stood at Rs.\r\n19,686.85 crores as against Rs. 16,963.07 crores for the\
    \ year ended 31st March, 2023. The profit after tax \r\nincreased by 20.26 %and\
    \ stands at Rs. 7,190.48 crores as against Rs. 5,979.34 crores recorded in the\
    \ \r\nprevious year. The earning per share (basic) increased by 20.00 % and was\
    \ Rs. 191.63 as against Rs.\r\n159.69 recorded in the previous year.\r\n \r\n\
    Assets under Management : \r\nTotal Assets under Management as on 31st\r\n March,\
    \ 2024 increased by 21.10% and stood at Rs. 224,861.98 \r\ncrores as compared\
    \ to Rs. 185,682.86 crores as on 31st March, 2023 and Rs. 214,233.47 crores as\
    \ on 31st\r\nDecember, 2023.\r\n \r\nDividend: \r\nThe Board of Directors has\
    \ recommended a final dividend of Rs. 15/- per equity share of nominal face value\
    \ \r\nof Rs.10/- each fully paid up i.e. 150%, for the Financial Year 2023-24\
    \ subject to approval by Members in the \r\nensuing 45th Annual General Meeting\
    \ of the Company. This is in addition to the two Interim Dividend of Rs. \r\n\
    20/- and Rs. 10/- per equity share of Rs. 10/- each fully paid-up (200%) and (100%)\
    \ for the Financial Year \r\n2023-24 declared by the Board of Directors of the\
    \ Company on October 26, 2023 and January 25, 2024 . \r\nWith this the total dividend\
    \ for the financial year 2023-24 will be Rs. 45/- per share (i.e. 450%). Pursuant\
    \ to \r\nRegulation 42 of the Securities and Exchange Board of India (Listing\
    \ Obligations and Disclosure \r\nRequirements) Regulations, 2015 and subject to\
    \ the confirmation by the Stock Exchanges, the Book Closure \r\nperiod for the\
    \ purpose of payment of the final dividend and 45th AGM will be from July 24,\
    \ 2024 to July 30, \r\n2024 (both days inclusive). The final dividend will be\
    \ paid to eligible Members on or before August 28, 2024 \r\nsubject to deduction\
    \ of tax at source as per the applicable rate(s) to the eligible shareholders.\r\
    \n \r\nContd ………..2/-"
