  - id: c7e34cf6-2025-5c71-8105-40c47b46cca8
    discovery_sentence: Shriram Finance recorded a 21.17 percentage point net profit
      versus net interest income growth gap from September 2025 to September 2026
      on a standalone basis.
    why_it_matters:
    - text: Profit growth exceeded net-interest-income growth in the same standalone
        quarter, so the earnings acceleration is not explained by the top-line interest
        spread alone.
      claim_id: 01620ba8-e4fd-5029-ab18-4c839dc9dd72
    - text: AUM is a point-in-time stock and is retained separately; it is not mixed
        into a quarterly income growth calculation.
      claim_id: d005a24a-7246-5834-a166-c71e3836e6a0
    - text: The distinction directs review toward provisions, operating costs and
        non-interest items without claiming any of them caused the gap.
      claim_id: 95920e95-220e-50b7-af4c-53108266f828
