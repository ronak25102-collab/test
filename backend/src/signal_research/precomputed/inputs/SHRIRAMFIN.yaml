    text: "PRESS RELEASE \r\n \r\n \r\nFriday, 23rd\r\n October, 2026, Mumbai : The\
      \ Board Meeting of Shriram Finance Limited (SFL) was held \r\ntoday to consider\
      \ the unaudited financial results for the second quarter ended 30\r\nth September,\
      \ 2026.\r\n \r\nFinancials (Standalone) : \r\nSecond quarter ended 30\r\nth\
      \ \r\n September, 2026 : \r\nThe Net Interest Income for the second quarter\
      \ ended 30\r\nth September, 2026 increased by 38.20%\r\nand stood at Rs. 8,661.04\
      \ crores as against Rs. 6,266.84 crores in the same period of the previous year.\
      \ \r\nThe profit after tax increased by 59.37% and stands at Rs. 3,677.03 crores\
      \ as against Rs. 2,307.18 crores \r\nrecorded in the same period of the previous\
      \ year. The earning per share (basic) increased by 27.38%\r\nand stands at Rs.\
      \ 15.63 as against Rs. 12.27 recorded in the same period of the previous year.\r\
      \nFinancials (Standalone) : \r\nHalf-year ended 30 September, 2026 : \r\nThe\
      \ Net Interest Income for the half-year ended 30 September, 2026 increased by\
      \ 35.98% and stood \r\nat Rs. 16,716.74 crores as against Rs 12,293.27 crores\
      \ in the same period of the previous year. The \r\nprofit after tax increased\
      \ by 59.57% and stands at Rs. 7,121.59 crores as against Rs. 4,462.91 crores\
      \ in \r\nthe same period of the previous year. The earning per share (basic)\
      \ increased by 28.36% and stands \r\nat Rs. 30.46 as against Rs. 23.73 recorded\
      \ in the same period of the previous year. \r\n \r\nInterim Dividend :-\r\n\
      The Board declared an Interim Dividend of Rs. 6.50 (325%) per share, the Record\
      \ Date for the \r\nentitlement thereof has been fixed as October 29, 2026.\r\
      \n \r\nAssets under Management : \r\nTotal Assets under Management as on 30th\
      \ September, 2026 increased by 16.96% and stood at Rs.\r\n329,021.72 crores\
      \ as compared to Rs. 281,309.46 crores as on 30th September, 2025 and Rs. 313,798.39\
      \ \r\ncrores as on 30\r\nth June, 2026.\r\n \r\n \r\n \r\nContd…….2"
