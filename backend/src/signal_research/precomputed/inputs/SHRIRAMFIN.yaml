    text: "(2) \r\n \r\n \r\nAbout Shriram Finance Limited.\r\nShriram Finance Limited\
      \ is the flagship company of the Shriram group which has significant presence\
      \ \r\nin Consumer Finance, Life Insurance, General Insurance, Housing Finance,\
      \ Stock Broking and \r\nDistribution businesses. Shriram Finance Limited is\
      \ one of India’s largest retail asset financing Non\uFFFEBanking Finance Companies\
      \ (NBFC) with Assets under Management (AUM) above Rs. 3.29 trillion. \r\nEstablished\
      \ in 1979, Shriram Finance is a holistic finance provider catering to the needs\
      \ of Small Road \r\nTransport Operators and small business owners and is a leader\
      \ in organised financing of pre-owned \r\ncommercial vehicles and two wheelers.\
      \ It has vertically integrated business model and offers financing \r\nnumber\
      \ of products which include passenger commercial vehicles, loans to micro and\
      \ small and \r\nmedium enterprises (MSMEs), tractors & farm equipment, gold,\
      \ personal loans and working capital \r\nloans etc. Over last 47 years, it has\
      \ developed strong competencies in the areas of loan origination, \r\nvaluation\
      \ of pre-owned commercial vehicles and other assets, and collections. It has\
      \ a pan India \r\npresence with network of 3,225 branches and an employee strength\
      \ of 82,292 servicing to 105.74 \r\nlakhs of customers.\r\n \r\nFor Further\
      \ information, please contact: \r\nSanjay K. Mundra \r\nShriram Finance Limited\
      \ \r\n+91 22 40959507\r\nsmundra@shriramfinance.in"
    character_start: null
    character_end: null
