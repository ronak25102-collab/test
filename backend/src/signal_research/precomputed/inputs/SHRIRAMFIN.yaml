    text: "(2)\r\nDividend:\r\nThe Board of Directors has recommended a final dividend\
      \ of Rs. 3/- per equity share of nominal \r\nface value of Rs. 2/- each fully\
      \ paid up i.e. 150%, for the financial year 2024-25 subject to \r\napproval\
      \ by Members in the ensuing 46th Annual General Meeting (46th AGM) of the Company.\
      \ \r\nThis is in addition to the interim dividend of Rs. 22/- per equity share\
      \ (pre-split) of Rs. 10/-\r\neach and second interim dividend Rs. 2.50 per equity\
      \ share of Rs. 2/- each (post-split) fully \r\npaid-up for the financial year\
      \ 2024-25 declared by the Company on October 25, 2024 and \r\nJanuary 24, 2025\
      \ respectively. With this the total dividend for the financial year 2024-25\
      \ will be \r\nRs. 9.90 per share of Rs. 2/- each after adjusting for split.\
      \ Pursuant to Regulation 42 of the \r\nSecurities and Exchange Board of India\
      \ (Listing Obligations and Disclosure Requirements) \r\nRegulations, 2015 and\
      \ subject to the confirmation by the Stock Exchanges, the book closure \r\n\
      period for the purpose of payment of the final dividend and 46th AGM will be\
      \ from July 12, 2025 \r\nto July 18, 2025 (both days inclusive). The final dividend\
      \ will be paid to eligible Members on or \r\nbefore August 16, 2025 subject\
      \ to deduction of tax at source as per the applicable rate(s) to the \r\neligible\
      \ shareholders.\r\nAbout Shriram Finance Limited.\r\nShriram Finance Limited\
      \ is the flagship company of the Shriram group which has significant \r\npresence\
      \ in Consumer Finance, Life Insurance, General Insurance, Stock Broking and\
      \ \r\nDistribution businesses. Shriram Finance Limited is one of India’s largest\
      \ retail asset financing \r\nNon-Banking Finance Companies (NBFC) with Assets\
      \ under Management (AUM) above Rs. \r\n2.63 trillion. Established in 1979, Shriram\
      \ Finance is a holistic finance provider catering to the \r\nneeds of Small\
      \ Road Transport Operators and small business owners and is a leader in \r\n\
      organised financing of pre-owned commercial vehicles and two wheelers. It has\
      \ vertically \r\nintegrated business model and offers financing number of products\
      \ which include passenger \r\ncommercial vehicles, loans to micro and small\
      \ and medium enterprises (MSMEs), tractors & \r\nfarm equipment, gold, personal\
      \ loans and working capital loans etc. Over last 46 years, it has \r\ndeveloped\
      \ strong competencies in the areas of loan origination, valuation of pre-owned\
      \ \r\ncommercial vehicles and other assets, and collections. It has a pan India\
      \ presence with network \r\nof 3,220 branches and an employee strength of 79,872\
      \ servicing to 95.56 lakhs of customers.\r\nFor Further information, please\
      \ contact:\r\nSanjay K. Mundra\r\nExective Director \r\nShriram Finance Limited\
      \ \r\n+91 22 40959507, smundra@shriramfinance.in"
