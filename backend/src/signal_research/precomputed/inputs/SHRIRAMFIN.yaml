  sha256: 4b2973dcd57842caa1d9521035a5be748f0cb8610468eabeeb793eb804a5d22f
  page_number: 1
  exact_passage: "PRESS RELEASE \r\n \r\nFriday, 25th October, 2024, Mumbai : The\
    \ Board Meeting of Shriram Finance Limited (SFL) (Formerly known \r\nas Shriram\
    \ Transport Finance Company Limited (STFC)) was held today to consider the unaudited\
    \ financial \r\nresults for the second quarter ended 30th September, 2024.\r\n\
    \ \r\nFinancials (Standalone) : \r\nSecond quarter ended 30th \r\n September,\
    \ 2024 : \r\nThe Net Interest Income for the second quarter ended 30th September,\
    \ 2024 increased by 16.37% and stood at\r\nRs. 5,606.74 crores as against Rs.\
    \ 4,818.18 crores in the same period of the previous year. The profit after tax\
    \ \r\nincreased by 18.30% and stands at Rs. 2,071.26 crores as against Rs. 1,750.84\
    \ crores recorded in the same \r\nperiod of the previous year. The earning per\
    \ share (basic) increased by 18.04% and stands at Rs. 55.09 as \r\nagainst Rs.\
    \ 46.67 recorded in the same period of the previous year.\r\nInterim Dividend\
    \ :-\r\nThe Board declared an Interim Dividend of (220%) Rs. 22/- per share, the\
    \ Record Date for the entitlement thereof \r\nhas been fixed as November 07, 2024.\r\
    \nAssets under Management : \r\nTotal Assets under Management as on 30th September,\
    \ 2024 increased by 19.94% and stood at Rs. 243,042.55\r\ncrores as compared to\
    \ Rs. 202,640.96 crores as on 30th September, 2023 and Rs. 233,443.63 crores as\
    \ on 30th\r\nJune, 2024.\r\n \r\nFinancials (Consolidated) : \r\nSecond quarter\
    \ ended 30th September, 2024 : \r\nThe Board of Directors of the Company in its\
    \ meeting held on May 13, 2024 had approved the proposal for \r\ndisinvestment\
    \ of the Company’s entire stake in Shriram Housing Finance Limited, a debt-listed\
    \ non-material \r\nsubsidiary of the Company and in this regard, the Company has\
    \ entered into the share purchase agreement, \r\ninter-alia, with Mango Crest\
    \ Investment Ltd (an affiliate of Warburg Pincus).The Company's investment in\
    \ \r\nShriram Housing Finance Limited has been classified as Non-current Assets\
    \ held for sale and disclosed as \r\nDiscontinued Operations in the financial\
    \ results.\r\nConsolidated profit after tax increased by 20.17% and stands at\
    \ Rs. 2,153.27 crores as against Rs. 1,791.83 \r\ncrores recorded in the same\
    \ period of the previous year. Consolidated EPS (basic) increased by 19.58% and\
    \ \r\nstands at Rs. 56.93 as compared to Rs. 47.61 recorded in the same period\
    \ of the previous year .\r\n \r\nContd ……2/-"
