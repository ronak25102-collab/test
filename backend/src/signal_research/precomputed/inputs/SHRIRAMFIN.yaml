  page_number: 1
  exact_passage: "PRESS RELEASE \r\nFriday 24\r\nth\r\n July, 2026, Mumbai : The Board\
    \ Meeting of Shriram Finance Limited (SFL) was held today \r\nto consider the\
    \ unaudited financial results for the first quarter ended 30\r\nth June, 2026.\
    \ \r\n \r\nFinancials (Standalone) : \r\nFirst quarter ended 30\r\nth\r\n June,\
    \ 2026 : \r\nThe Net Interest Income for the first quarter ended 30\r\nth June,\
    \ 2026 increased by 33.67 % and stood \r\nat Rs. 8,055.70 crores as against Rs.\
    \ 6,026.43 crores in the same period of the previous year. The profit \r\nafter\
    \ tax increased by 59.79 % and stood at Rs. 3,444.56 crores as against Rs. 2,155.73\
    \ crores recorded \r\nin the same period of the previous year. The earning per\
    \ share (basic) increased by 29.41 % and was\r\nRs. 14.83 as against Rs. 11.46\
    \ recorded in the same period of the previous year.\r\n \r\nAssets under Management\
    \ : \r\nTotal Assets under Management as on 30\r\nth June, 2026 increased by 15.26\
    \ % and stood at Rs. \r\n313,798.39 crores as compared to Rs. 272,249.01 crores\
    \ as on 30\r\nth June, 2025 and Rs. 302,273.75\r\ncrores as on 31st March, 2026.\
    \ \r\n \r\nAbout Shriram Finance Limited.\r\nShriram Finance Limited is the flagship\
    \ company of the Shriram group which has significant presence \r\nin Consumer\
    \ Finance, Life Insurance, General Insurance, Stock Broking and Distribution businesses.\
    \ \r\nShriram Finance Limited is one of India’s largest retail asset financing\
    \ Non-Banking Finance \r\nCompanies (NBFC) with Assets under Management (AUM)\
    \ above Rs. 3.13 trillion. Established in 1979, \r\nShriram Finance is a holistic\
    \ finance provider catering to the needs of Small Road Transport Operators \r\n\
    and small business owners and is a leader in organised financing of pre-owned\
    \ commercial vehicles \r\nand two wheelers. It has vertically integrated business\
    \ model and offers financing number of products \r\nwhich include passenger commercial\
    \ vehicles, loans to micro and small and medium enterprises \r\n(MSMEs), tractors\
    \ & farm equipment, gold, personal loans and working capital loans etc. Over last\
    \ \r\n47 years, it has developed strong competencies in the areas of loan origination,\
    \ valuation of pre\uFFFEowned commercial vehicles and other assets, and collections.\
    \ It has a pan India presence with \r\nnetwork of 3,225 branches and an employee\
    \ strength of 78,902 servicing to 103.01 lakhs of customers.\r\nFor Further information,\
    \ please contact: \r\nSanjay K. Mundra\r\nExective Director \r\nShriram Finance\
    \ Limited \r\n+91 22 40959507, smundra@shriramfinance.in"
  row_label: Net Interest Income
  column_label: Quarter ended 2026-06-30
  section: null
