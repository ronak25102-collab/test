    text: "PRESS RELEASE\r\nFriday 25\r\nth April, 2025, Mumbai : The Board Meeting\
      \ of Shriram Finance Limited (SFL) was \r\nheld today to consider the audited\
      \ financial results for the fourth quarter and the year ended \r\n31st March,\
      \ 2025. \r\nFinancials (Standalone) : \r\nFourth quarter ended 31\r\nst March,\
      \ 2025 :\r\nThe Net Interest Income for the fourth quarter ended 31st March,\
      \ 2025 increased by 13.40 % and \r\nstood at Rs. 6,051.19 crores as against\
      \ Rs. 5,336.06 crores in the same period of the previous \r\nyear. The profit\
      \ after tax increased by 9.95 % and stood at Rs. 2,139.39 crores as against\
      \ Rs.\r\n1,945.87 crores recorded in the same period of the previous year. The\
      \ earning per share (basic) \r\nincreased by 9.85 % and was Rs. 11.38 as against\
      \ Rs. 10.36 recorded in the same period of the \r\nprevious year.\r\nFinancial\
      \ Year ended 31st March, 2025 :\r\nThe Net Interest Income for the year ended\
      \ 31st March, 2025 increased by 15.99 % and stood at\r\nRs. 22,835.09 crores\
      \ as against Rs. 19,686.85 crores for the year ended 31st March, 2024. The \r\
      \nprofit after tax [including one time gain of Rs. 1,489.39 crores (net of tax)\
      \ for sale of our stake in \r\nsubsidiary Shriram Housing Finance Limited (SHFL)\
      \ (now renamed as Truhome Finance Limited)] and \r\nstands at Rs. 9,761.00 crores\
      \ as against Rs. 7,190.48 crores recorded in the same period of the \r\nprevious\
      \ year. However, excluding one time gain of Rs. 1,489.39 crores (net of tax)\
      \ for sale of our stake \r\nin subsidiary SHFL, the profit after tax increased\
      \ by 15.04 % and stands at Rs. 8,271.61 crores as \r\nagainst Rs. 7,190.48 crores\
      \ in the same period of the previous year. The earning per share \r\n(basic)\
      \ increased by 14.79 % (excluding sale of our stake in subsidiary SHFL) stands\
      \ at Rs. 44.00\r\nas against Rs. 38.33 recorded in the same period of the previous\
      \ year.\r\nAssets under Management :\r\nTotal Assets under Management as on\
      \ 31st\r\n March, 2025 increased by 17.05 % and stood at Rs. \r\n2,63,190.27\
      \ crores as compared to Rs. 2,24,861.98 crores as on 31st March, 2024 and Rs.\
      \ \r\n2,54,469.69 crores as on 31st December, 2024.\r\nContd ………..2/-"
