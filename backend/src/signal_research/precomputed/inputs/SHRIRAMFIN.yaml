    text: "PRESS RELEASE\r\nFriday, 31st October, 2025, Mumbai : The Board Meeting\
      \ of Shriram Finance Limited (SFL) was held today \r\nto consider the unaudited\
      \ financial results for the second quarter ended 30\r\nth September, 2025.\r\
      \nFinancials (Standalone) : \r\nSecond quarter ended 30\r\nth September, 2025\
      \ :\r\nThe Net Interest Income for the second quarter ended 30\r\nth September,\
      \ 2025 increased by 11.77% and stood \r\nat Rs. 6,266.84 crores as against Rs.\
      \ 5,606.74 crores in the same period of the previous year. The profit after\
      \ \r\ntax increased by 11.39% and stands at Rs. 2,307.18 crores as against Rs.\
      \ 2,071.26 crores recorded in the \r\nsame period of the previous year. The\
      \ earning per share (basic) increased by 11.34% and stands at Rs. \r\n12.27\
      \ as against Rs. 11.02 recorded in the same period of the previous year.\r\n\
      Interim Dividend :-\r\nThe Board declared an Interim Dividend of (240%) Rs.\
      \ 4.80 per share, the Record Date for the entitlement \r\nthereof has been fixed\
      \ as November 07, 2025.\r\nAssets under Management :\r\nTotal Assets under Management\
      \ as on 30th September, 2025 increased by 15.74% and stood at Rs.\r\n2,81,309.46\
      \ crores as compared to Rs. 2,43,042.55 crores as on 30th September, 2024 and\
      \ Rs. 2,72,249.01\r\ncrores as on 30\r\nth June, 2025.\r\nAbout Shriram Finance\
      \ Limited.\r\nShriram Finance Limited is the flagship company of the Shriram\
      \ group which has significant presence in \r\nConsumer Finance, Life Insurance,\
      \ General Insurance, Housing Finance, Stock Broking and Distribution \r\nbusinesses.\
      \ Shriram Finance Limited is one of India’s largest retail asset financing Non-Banking\
      \ Finance \r\nCompanies (NBFC) with Assets under Management (AUM) above Rs.\
      \ 2.81 trillion. Established in 1979, \r\nShriram Finance is a holistic finance\
      \ provider catering to the needs of Small Road Transport Operators and \r\n\
      small business owners and is a leader in organised financing of pre-owned commercial\
      \ vehicles and two \r\nwheelers. It has vertically integrated business model\
      \ and offers financing number of products which include \r\npassenger commercial\
      \ vehicles, loans to micro and small and medium enterprises (MSMEs), tractors\
      \ & \r\nfarm equipment, gold, personal loans and working capital loans etc.\
      \ Over last 45 years, it has developed \r\nstrong competencies in the areas\
      \ of loan origination, valuation of pre-owned commercial vehicles and other\
      \ \r\nassets, and collections. It has a pan India presence with network of 3,225\
      \ branches and an employee \r\nstrength of 78,833 servicing to 96.64 lakhs of\
      \ customers.\r\nFor Further information, please contact:\r\nSanjay K. Mundra\
      \ \r\nShriram Finance Limited \r\n+91 22 40959507\r\nsmundra@shriramfinance.in"
