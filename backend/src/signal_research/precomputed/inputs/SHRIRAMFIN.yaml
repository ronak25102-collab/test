      \ i.e. 300%, for the financial year 2025-26 subject to approval \r\nby Members\
      \ in the ensuing 47th Annual General Meeting (47th AGM) of the Company. This\
      \ is \r\nin addition to the interim dividend of Rs. 4.80 per equity share declared\
      \ on October 31, 2025.\r\nWith this the total dividend for the financial year\
      \ 2025-26 will be Rs. 10.80 per share of Rs. 2/-\r\neach.\r\nPursuant to Regulation\
      \ 42 of the Securities and Exchange Board of India (Listing Obligations \r\n\
      and Disclosure Requirements) Regulations, 2015, the Register of Members and\
      \ the Share \r\nTransfer Books of the Company will remain closed from Saturday,\
      \ July 04, 2026 to Friday, July \r\n10, 2026 (both days inclusive) for taking\
      \ record of the Members of the Company for the purpose \r\nof payment of the\
      \ final dividend and 47th AGM, if approved by the Members at the ensuing \r\n\
      47th AGM. The final dividend will be paid to the eligible Members on or before\
      \ August 09, 2026 \r\nsubject to deduction of tax at source as per the applicable\
      \ rate(s),if approved by the Members \r\nat the 47th AGM.\r\nAbout Shriram Finance\
      \ Limited.\r\nShriram Finance Limited is the flagship company of the Shriram\
      \ group which has significant \r\npresence in Consumer Finance, Life Insurance,\
      \ General Insurance, Stock Broking and \r\nDistribution businesses. Shriram\
      \ Finance Limited is one of India’s largest retail asset financing \r\nNon-Banking\
      \ Finance Companies (NBFC) with Assets under Management (AUM) above Rs. \r\n\
      3.02 trillion. Established in 1979, Shriram Finance is a holistic finance provider\
      \ catering to the \r\nneeds of Small Road Transport Operators and small business\
      \ owners and is a leader in \r\norganised financing of pre-owned commercial\
      \ vehicles and two wheelers. It has vertically \r\nintegrated business model\
      \ and offers financing number of products which include passenger \r\ncommercial\
      \ vehicles, loans to micro and small and medium enterprises (MSMEs), tractors\
      \ & \r\nfarm equipment, gold, personal loans and working capital loans etc.\
      \ Over last 47 years, it has \r\ndeveloped strong competencies in the areas\
      \ of loan origination, valuation of pre-owned \r\ncommercial vehicles and other\
      \ assets, and collections. It has a pan India presence with network \r\nof 3,225\
      \ branches and an employee strength of 76,241 servicing to 97.33 lakhs of customers.\r\
