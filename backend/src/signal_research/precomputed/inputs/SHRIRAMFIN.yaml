  page_number: 1
  exact_passage: "PRESS RELEASE \r\n \r\nFriday, 24th\r\n January, 2025, Mumbai :\
    \ The Board Meeting of Shriram Finance Limited (SFL) was held today to \r\nconsider\
    \ the unaudited financial results for the Third quarter ended 31st December, 2024.\r\
    \n \r\nFinancials (Standalone) : \r\nThird quarter ended 31st\r\n December, 2024\
    \ : \r\nThe Net Interest Income for the Third quarter ended 31st December, 2024\
    \ increased by 14.31 % and stood at\r\nRs. 5,822.69 crores as against Rs. 5,093.93\
    \ crores in the same period of the previous year. The profit after tax \r\n[including\
    \ one time gain of Rs. 1,489.39 crores (net of tax) for sale of our stake in subsidiary\
    \ Shriram Housing \r\nFinance Limited (SHFL) (now renamed as Truhome Finance Limited)]\
    \ stands at Rs. 3,569.76 crores as against \r\nRs. 1,818.33 crores recorded in\
    \ the same period of the previous year. However, excluding one time gain of Rs.\
    \ \r\n1,489.39 crores (net of tax) for sale of our stake in subsidiary SHFL, the\
    \ profit after tax increased by 14.41 % \r\nand stands at Rs. 2,080.37 crores\
    \ as against Rs. 1,818.33 crores in the same period of the previous year. The\
    \ \r\nearning per share (basic) increased by 14.36 % (excluding sale of our stake\
    \ in subsidiary SHFL) and stands at \r\nRs. 11.07 as against Rs. 9.68 recorded\
    \ in the same period of the previous year.\r\nFinancials (Standalone) : \r\nNine\
    \ months ended 31st\r\n December, 2024 : \r\nThe Net Interest Income for the Nine\
    \ months ended 31st December, 2024 increased by 16.95 % and stood at \r\nRs. 16,783.90\
    \ crores as against Rs. 14,350.79 crores in the same period of the previous year.\
    \ The profit after \r\ntax [including one time gain of Rs. 1,489.39 crores (net\
    \ of tax) for sale of our stake in subsidiary SHFL (now \r\nrenamed as Truhome\
    \ Finance Limited)] stands at Rs. 7,621.61 crores as against Rs. 5,244.61 crores\
    \ recorded \r\nin the same period of the previous year. However, excluding one\
    \ time gain of Rs. 1,489.39 crores (net of tax) \r\nfor sale of our stake in subsidiary\
    \ SHFL, the profit after tax increased by 16.92 % and stands at Rs. 6,132.22\r\
    \ncrores as against Rs. 5,244.61 crores in the same period of the previous year.\
    \ The earning per share (basic) \r\nincreased by 16.62 % (excluding sale of our\
    \ stake in subsidiary SHFL) and stands at Rs. 32.62 as against Rs. \r\n27.97 recorded\
    \ in the same period of the previous year.\r\n \r\nInterim Dividend :-\r\nThe\
    \ Board declared an Interim Dividend of (125%) Rs. 2.50 per share, the Record\
    \ Date for the entitlement \r\nthereof has been fixed as January 31, 2025.\r\n\
    \ \r\n \r\nContd ……2/-"
