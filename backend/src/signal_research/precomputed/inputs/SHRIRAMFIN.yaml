    text: "PRESS RELEASE \r\n \r\nFriday, 24th\r\n January, 2025, Mumbai : The Board\
      \ Meeting of Shriram Finance Limited (SFL) was held today to \r\nconsider the\
      \ unaudited financial results for the Third quarter ended 31st December, 2024.\r\
      \n \r\nFinancials (Standalone) : \r\nThird quarter ended 31st\r\n December,\
      \ 2024 : \r\nThe Net Interest Income for the Third quarter ended 31st December,\
      \ 2024 increased by 14.31 % and stood at\r\nRs. 5,822.69 crores as against Rs.\
      \ 5,093.93 crores in the same period of the previous year. The profit after\
      \ tax \r\n[including one time gain of Rs. 1,489.39 crores (net of tax) for sale\
      \ of our stake in subsidiary Shriram Housing \r\nFinance Limited (SHFL) (now\
