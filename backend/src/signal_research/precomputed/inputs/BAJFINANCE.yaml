    - text: Gross and net bad-loan ratios are different measures; a net ratio also
        reflects provisioning and is not substituted for the gross measure.
      claim_id: a52f2d9a-1237-50dd-8d53-49d57184503b
    - text: Following the same named portfolio in later disclosures can distinguish
        persistence from a single reporting-date movement.
      claim_id: 85729960-301a-53e6-ad69-166c7fd658f9
