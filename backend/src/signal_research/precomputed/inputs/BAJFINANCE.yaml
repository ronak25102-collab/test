    column_label: null
    text: "Executive summary – Bajaj Finance\r\nOverview\r\n• Focused on Urban, Rural,\
      \ MSME, Commercial and Payments businesses\r\n• Strategic business unit organisation\
      \ design supported by horizontal common utility functions to drive domain expertise,\
      \ \r\nscalability and operating leverage\r\n• Leveraging AI, digital transformation,\
      \ cloud computing, and other modern technology stack to increase revenue, reduce\
      \ \r\ncosts, enhance scalability, and improve productivity and controllership\r\
      \n• Focused on cross sell, customer experience and product & process innovations\
      \ to create a differentiated and profitable \r\nbusiness model\r\n• AUM of ₹\
      \ 353,765 crore as of 31 December 2025\r\n• AUM mix as of 31 December 2025 –\
      \ Urban : Rural : MSME : Commercial : Mortgage stood at 42% : 14% : 19% : 16%\
      \ : 9%\r\n• Profit after tax (PAT) in Q3 FY26 was ₹ 4,581 crore. \r\n• PAT (before\
      \ accelerated ECL provision, one-time charge of New Labour Codes, gain on sale\
      \ of BHFL shares, and tax \r\nthereon) grew by 24% to ₹ 4,606 crore in Q3 FY26\
      \ from ₹ 3,706 crore in Q3 FY25. \r\n• Capital adequacy ratio (including Tier\
      \ II capital) of 21.45% as of 31 December 2025. Tier I capital stood at 20.60%\r\
      \nConsumer\r\nbusiness\r\n• Present in 1,535 locations with 164K+ points of\
      \ sale as of 31 December 2025\r\n• Largest consumer electronics, digital products\
      \ & lifestyle products lender in India\r\n• 2-wheeler financing business disbursed\
      \ 185K accounts in Q3 FY26 \r\n• 3-wheeler financing business disbursed 11K\
      \ accounts in Q3 FY26\r\n• Amongst the largest personal loan lenders in India\r\
      \nPayments • EMI Card franchise stood at 87.02 MM cards in force (CIF) as of\
      \ 31 December 2025\r\n• Digital app platform has 82.53 MM net users as of 31\
