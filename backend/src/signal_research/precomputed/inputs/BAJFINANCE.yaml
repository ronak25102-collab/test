    text: "Product Per Customer (PPC)\r\n48\r\nOur customer-centric strategy, characterized\
      \ by strong customer trust and relevant product offerings, will help gain the\
      \ \r\nwallet share of existing customers. \r\nProduct Per Customer (PPC) is\
      \ a business metric used to determine average number of products or services\
      \ (active or closed) \r\na customer has availed over the lifetime with BFL.\
      \ We are deeply investing in customer centricity strategy to improve this \r\
      \nmetric organically over time. Product offerings are classified into 4 product\
      \ segments: \r\n1. Lending: All lending products of the company \r\n2. Distribution\
      \ of products and services: All value-added products and services of BFL and\
      \ partners\r\n3. Deposits: Fixed Deposits \r\n4. Payments: UPI, PPI, BBPS, Merchant\
      \ QR, FASTag\r\nBase product is included in PPC calculation\r\n2.53 2.52 2.48\
