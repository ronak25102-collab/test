    column_label: null
    text: "Section 01 \r\nExecutive summary –\r\nQ2 FY27\r\n3\r\n1.1 Quarter gone\
      \ by \r\n1.2 Lead financial indicators"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: 41020cde-becb-52d5-a6e8-ff9e7292bf53
    document_id: 9176dab6-1279-514a-b7b2-776683f04229
    page_index: 4
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "An excellent quarter across all key metrics of AUM, new customer \r\naddition,\
      \ credit cost, profit, ROA and ROE. AUM grew by 26% to\r\n₹ 584,624 crore. Delivered\
      \ AUM addition of ₹ 37,680 crore. PBT \r\ngrew by 29% to ₹ 8,537 crore. Booked\
      \ 13.45 MM new loans and \r\nadded 4.42 MM new customers in Q2. Customer franchise\
      \ stood at \r\n128.85 MM. \r\n4\r\nOpex to Net \r\ntotal income\r\n33.0%\r\n\
      Q2 FY26\r\n33.1%\r\nNet NPA\r\n0.42%\r\nQ2 FY26\r\n0.60%\r\nROE\r\n20.6%\r\n\
      Q2 FY26\r\n19.1%\r\nPAT\r\nPre-minority interest\r\n₹ 6,367\r\nCr\r\nGrowth\r\
      \n29%\r\nAUM\r\n₹ 584,624\r\nCr\r\nGrowth\r\n26%\r\nPBT\r\n₹ 8,537\r\nCr\r\n\
      Growth\r\n29%\r\nQ2 FY27 Executive summary - Consolidated\r\nAnnualised\r\n\
      Growth percentage, unless specified otherwise, refers to growth over the same\
      \ period in last year."
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: a9c7e866-2c51-54b1-8983-3adde902204e
    document_id: 9176dab6-1279-514a-b7b2-776683f04229
    page_index: 5
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "Balance sheet and business metrics\r\n1. AUM was up 26% to ₹ 584,624 crore\
      \ as against ₹ 462,261 crore as of 30 September 2025.\r\n2. AUM addition was\
      \ ₹ 37,680 crore in Q2 FY27.\r\n3. New loans booked grew by 11% to 13.45 MM\
      \ in Q2 FY27 as against 12.17 MM in Q2 FY26 – YOY volume growth is not \r\n\
      comparable due to early onset of festival season last year. The Company expects\
      \ to disburse 60-62 MM new loans in FY27. \r\nCustomer franchise and geographic\
      \ footprint\r\n4. In Q2, the Company added 4.42 MM customers to its franchise.\
      \ The Company expects to add 18-20 MM new customers to \r\nits franchise in\
      \ FY27. \r\n5. Customer franchise stood at 128.85 MM as of 30 September 2026.\
      \ Cross sell franchise stood at 82.36 MM.\r\n6. In Q2, the Company added 4.1K\
      \ distribution points. Geographic presence stood at 4,091 locations and active\
      \ distribution \r\npoints were over 254K as of 30 September 2026. The Company\
      \ plans to open 150-175 new locations in FY27.\r\n7. In Q2, the Company added\
      \ 321 Gold Loan branches. BFL now has 2,022 Gold loan and 480 MFI branches.\
      \ The Company \r\nexpects to close FY27 with 2,700-2,800 Gold Loan branches\
      \ and 520-550 MFI branches.\r\nLiquidity and cost of funds\r\n8. Liquidity buffer\
      \ stood at ₹ 19,995 crore as of 30 September 2026.\r\n9. In Q2, cost of funds\
      \ was 7.31%, improving 9 bps over Q1 FY27. \r\n10. Deposits book stood at ₹\
      \ 69,754 crore as of 30 September 2026. It contributed to 14% of consolidated\
      \ borrowings.\r\nLead financial indicators for Q2 FY27 – consolidated (1/4)\r\
      \n5"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: 960e9899-c5cd-5baa-bdbb-08ec1e4ea4a7
    document_id: 9176dab6-1279-514a-b7b2-776683f04229
    page_index: 6
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "Operating efficiencies\r\n11. Net interest income grew by 24% to ₹ 13,335\
      \ crore as against ₹ 10,785 crore in Q2 FY26. \r\n12. Net total income grew\
      \ by 23% to ₹ 15,974 crore as against ₹ 12,982 crore in Q2 FY26.\r\n13. Opex\
      \ to Net total income was 33.0% as against 33.1% in Q2 FY26. The Company expects\
      \ 25-40 bps improvement in Opex \r\nto NTI in FY27\r\n14. Full-time employee\
      \ count stood at 75,845 as of 30 September 2026. The Company added 2,584 employees\
      \ in Q2 FY27. \r\nAdjusted for Gold Loan and MFI, the net addition was 1,058.\
      \ Employee attrition was 15.1% in Q2 FY27.\r\n15. The Fixed Term Contract (FTC)\
      \ resource count stood at 89,484 as of 30 September 2026. \r\nCredit cost\r\n\
      16. Loan losses and provisions in Q2 FY27 were ₹ 2,166 crore as against ₹ 2,080\
      \ crore in Q2 FY26. Q2 FY27 includes a prudent \r\nmanagement and macro-economic\
      \ provision of ₹ 337 crore. Excluding this, loan losses and provisions were\
      \ ₹ 1,829 crore, \r\na decline of 12% as against Q2 FY26.\r\n17. Loan loss to\
      \ average AUF was 1.56% in Q2 FY27 as against 1.88% in Q2 FY26. Excluding prudent\
      \ management and macro\uFFFEeconomic provision of ₹ 337 crore, it was 1.32%\
      \ in Q2 FY27.\r\n18. Stage 2 & 3 assets increased by ₹ 1,601 crore in Q2, including\
      \ a ₹ 1,047 crore increase in the gold loan business due to \r\nshort-tenor\
      \ schemes that are no longer being offered, taking Stage 2 & 3 assets to 2.02%\
      \ of loans from 1.87% in Q1 \r\nFY27. The Company does not expect impact on\
      \ its credit cost from this transitional increase in gold loan stage 2.\r\n\
      19. Adjusted for transient movement in gold loans, Stage 2 & 3 assets improved\
      \ to 1.88% of loans from 1.90% in Q1 FY27, \r\nreflecting improving asset quality\
      \ trends in portfolio. 6\r\nLead financial indicators for Q2 FY27 – consolidated\
      \ (2/4)"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: 0a99493c-cf1e-527a-a40a-b027515fc06d
    document_id: 9176dab6-1279-514a-b7b2-776683f04229
    page_index: 7
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "19. Vintage credit performance across 3MOB, 6MOB and 9MOB continues to\
      \ reflect significant improvement. We are optimistic \r\nabout credit cost outlook\
      \ for FY27. \r\n20. Asset quality remained strong, with GNPA and NNPA improving\
      \ to 1.06% and 0.42%, respectively, as of 30 September \r\n2026, compared with\
      \ 1.24% and 0.60% as of 30 September 2025.\r\n21. The provisioning coverage\
      \ ratio on stage 3 assets was 60% in Q2 FY27.\r\nProfitability and capital\r\
      \n22. Pre-provisioning operating profit grew by 23% to ₹ 10,699 crore in Q2\
      \ FY27.\r\n23. Consolidated profit before tax (PBT) grew by 29% to ₹ 8,537 crore\
      \ in Q2 FY27. PBT before prudent management and \r\nmacro-economic provision\
      \ grew by 34% to ₹ 8,874 crore.\r\n24. Consolidated profit after tax (PAT) grew\
      \ by 29% to ₹ 6,367 crore in Q2 FY27. PAT before prudent management and macro\uFFFE\
      economic provision grew by 34% to ₹ 6,619 crore.\r\n25. In Q2, Company delivered\
      \ annualised ROA of 4.6% as against 4.5% in Q2 FY26.\r\n26. In Q2, Company delivered\
      \ annualised ROE of 20.6% as against 19.1% in Q2 FY26.\r\n27. Capital adequacy\
      \ remained strong at 20.33% as of 30 Sep 2026. Tier-1 capital was 19.43%. \r\
      \n28. Consolidated Leverage ratio stood at 5.1x. The company has considered\
      \ leverage ratio at 5x-5.5x for resilience and capital \r\nplanning assessment.\r\
      \n7\r\nLead financial indicators for Q2 FY27 – consolidated (3/4)"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: bb2962da-43be-500c-bb23-35164f995e7e
    document_id: 9176dab6-1279-514a-b7b2-776683f04229
    page_index: 8
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "Additional update\r\n28. On 1st October 2026, the Board of Directors has\
      \ approved, subject to the approval of shareholders, issue of equity shares\
      \ \r\nfor an aggregate amount of up to ₹ 11,700 crore through Qualified Institutions\
      \ Placement to Qualified Institutional Buyers \r\nand preferential issue of\
      \ warrants convertible into equivalent number of equity shares for an aggregate\
      \ amount of up to ₹ \r\n5,800 crore to Bajaj Finserv Limited, the promoter and\
      \ holding company, in accordance with the SEBI (Issue of Capital and \r\nDisclosure\
      \ Requirements) Regulations, 2018, the Companies Act, 2013 and other applicable\
      \ laws, as amended.\r\n29. The Board’s decision of raising additional capital\
      \ is driven by various factors including strong India growth, underlying \r\n\
      growth momentum of the Company and its subsidiaries and increasing focus on\
      \ building resilience across various \r\ndimension of business.\r\n30. The Company\
      \ remains committed to building resilience across various dimensions of its\
      \ business, including maintaining a \r\nrobust capital position, strengthening\
      \ talent, technology and AI transformation, cyber resilience, regulatory compliances,\
      \ \r\nrobust provisioning coverage, diversified borrowings and robust liquidity,\
      \ while maintaining its financial sustainability \r\nmetrics.\r\n8\r\nLead financial\
      \ indicators for Q2 FY27 – consolidated (4/4)"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: c4262b73-29c4-531c-8c3d-f21f5c44c73f
