    text: "Executive summary – Bajaj Housing Finance\r\n28\r\nOverview\r\n• Subsidiary\
      \ of Bajaj Finance Limited\r\n• Independent organization design having all dedicated\
      \ functions and units to drive domain expertise, scalability and \r\noperating\
      \ leverage\r\n• Offers full range of mortgage products such as home loans, loan\
      \ against property and lease rental discounting to salaried \r\n& self-employed\
      \ customers. It also offers construction finance and inventory finance to credit\
      \ worthy developers\r\n• Focused on mass affluent and above customers (salaried\
      \ and self-employed)\r\n• AUM of ₹ 133,412 crore as of 31 December 2025. Profit\
      \ after tax of ₹ 665 crore in Q3 FY26\r\n• Capital adequacy ratio (including\
      \ Tier II capital) was 23.15% as of 31 December 2025\r\nHome Loans\r\n• Offers\
      \ home loans to all customer segments: Salaried, self-employed, and professionals\
      \ and all customer classes: Prime, \r\nNear Prime and Affordable for an average\
      \ ticket size of 47.3 lakhs\r\n• Leveraging Developer Finance relationships:\
      \ Key sourcing funnel for retail home loans\r\n• Focused on home loans – Purchase\
      \ and Balance transfer directly as well as through channel partners\r\n• Micro\
      \ market strategy to bifurcate locations into dedicated operational areas\r\n\
      • Present in 178 locations as of 31 December 2025\r\n• Home loan mix as of 31\
      \ December 2025 – Salaried : Self Employed : Professionals stood at 84% : 13%\
      \ : 3%\r\nLoan Against \r\nProperty\r\n• Offers LAP to all customer segments:\
      \ Self-employed, salaried and professionals for an average ticket size of 83.2\
      \ lakhs\r\n• Focused on sourcing from both intermediaries as well as direct-to-customer\
      \ channels\r\n• Present in 74 locations as of 31 December 2025"
