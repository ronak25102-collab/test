    text: "Executive summary – Bajaj Finance\r\nOverview\r\n• Focused on Consumer\
      \ Finance, Personal loans, MSME, Gold Loan, Wheels financing and Commercial\
      \ businesses.\r\n• Long-term strategy: building a customer-centric company serving\
      \ all needs of the customer, leveraging technology and AI \r\nto drive growth\
      \ and efficiency and maintaining a strong risk culture to build a resilient\
      \ and sustainable company.\r\n• Focused on cross sell, customer experience and\
      \ product & process innovations to create a differentiated & profitable \r\n\
      business model\r\n• AUM of ₹ 400,388 crore as of 30 June 2026\r\n• AUM mix as\
      \ of 30 June 2026 – Urban : Rural : SME : Commercial : Mortgage stood at 41%\
      \ : 16% : 18% : 15% : 10%\r\n• Profit after tax of ₹ 5,346 crore in Q1 FY27\r\
      \n• Capital adequacy ratio (including Tier II capital) of 20.90% as of 30 June\
      \ 2026. Tier I capital stood at 20.01%\r\nConsumer\r\nFinance\r\n• One of the\
      \ largest consumer financing company in the country, offers financing of consumer\
      \ electronics, digital products, \r\ne-Commerce, two wheelers & lifestyle products.\r\
      \n• Our extensive distribution network, comprising over 240K+ point of sale\
      \ across 1,515 urban and 2,558 rural locations.\r\n• EMI Card franchise stood\
      \ at 97.71 MM cards in force (CIF) as of 30 June 2026.\r\nPersonal \r\nLoans\r\
      \n• Among the largest personal loan companies in India, focused on pre-approved\
      \ and salaried personal loan offerings.\r\n• Continued focus on digital simplification,\
      \ process automation and customer journey enhancement is driving stronger \r\
      \ncustomer engagement and improved conversion rates.\r\n• AI driven voice initiatives\
      \ and AI text bots generated disbursement of ₹ 2,551 crore in Q1 FY27.\r\n30"
