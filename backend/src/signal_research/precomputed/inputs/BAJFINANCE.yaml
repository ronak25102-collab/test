    text: "1. Accelerated ECL provision: To enhance balance sheet resilience amidst\
      \ a volatile global economic \r\nenvironment; the Company has further strengthened\
      \ its provisioning framework by implementing a minimum \r\nLoss Given Default\
      \ (LGD) floor across all businesses. Accordingly, an accelerated ECL provision\
      \ of ₹ 1,406 \r\ncrore was made in Q3 across stages.\r\n2. One-time charge of\
      \ New Labour Codes: The Company took a one-time exceptional charge of ₹ 265\
      \ crore \r\ntowards increase in gratuity liabilities arising from past service\
      \ cost on account of the New Labour Codes \r\nreleased on 21 November 2025.\r\
      \nUpdate on accelerated ECL provision and one-time charge of \r\nNew Labour\
      \ Codes\r\n5\r\nParticulars Q3 FY26 Q3 FY25 Growth\r\nAUM 485,883 398,043 22%\r\
      \nProfit before tax 7,102 5,765 23%\r\nProfit after tax 5,317 4,308 23%\r\n\
      Annualised ROA 4.6% 4.5%\r\nAnnualised ROE 19.6% 19.1%\r\nBefore accelerated\
      \ ECL provision and one-time \r\ncharge of New Labour Codes\r\nAfter accelerated\
      \ ECL provision and one-time \r\ncharge of New Labour Codes\r\nParticulars Q3\
      \ FY26 Q3 FY25 Growth\r\nAUM 484,477 398,043 22%\r\nProfit before tax 5,431\
      \ 5,765 (6%)\r\nProfit after tax 4,066 4,308 (6%)\r\nAnnualised ROA 4.3%* 4.5%\r\
      \nAnnualised ROE 18.5%* 19.1%\r\n*Accelerated ECL and one-time charge of New\
      \ Labour Codes \r\nare considered on a non-annualised basis"
