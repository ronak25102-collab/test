    text: "Executive summary – Bajaj Finance\r\n30\r\nLoan against \r\nsecurities\r\
      \n• Operates across 21 locations through branch and digital channels, providing\
      \ seamless financing solutions\r\n• Offers short to medium-term loans against\
      \ shares, bonds, mutual funds, insurance policies and deposits across retail,\
      \ HNI, \r\nand promoter segments\r\nDeposits\r\n• Company accepts deposits from\
      \ retail and corporate clients to enhance funding diversification while optimizing\
      \ overall \r\nfunding cost\r\n• Deposits contribute 19% of standalone borrowings\
      \ and 14% of consolidated borrowings\r\nTreasury \r\n• Strategy is to create\
      \ a balanced mix of wholesale and retail borrowings with a focus on long term\
      \ borrowings\r\n• Cost of funds stood at 7.40% in Q2 FY27\r\n• Borrowings stood\
      \ at ₹ 370,644 crore with a diversified mix of 49% : 26% : 6% : 19% between\
      \ money markets, banks, ECB and \r\ndeposits as of 30 September 2026\r\nCredit\
      \ Quality\r\n• GNPA and NNPA as of 30 September 2026 stood at 1.33% and 0.53%\
      \ respectively\r\n• Provisioning coverage ratio as of 30 September 2026 was\
      \ 60%\r\n• Provisioning coverage on stage 1 & 2 stood at 181 bps as of 30 Sep\
      \ 2026\r\nCredit Rating\r\n• Credit rating for long term borrowing is AAA/Stable\
      \ by CRISIL, ICRA, CARE & India Ratings\r\n• Credit rating for short term borrowing\
      \ is A1+ by CRISIL, ICRA, CARE & India Ratings\r\n• Credit rating for FD program\
      \ is AAA (Stable) by CRISIL & ICRA\r\n• Long term & short term issuer credit\
      \ rating of BBB/Stable & A-2 respectively by S&P Global ratings\r\n• Corporate\
      \ family rating of Baa3 with a stable outlook by Moody’s Ratings\r\nRegulated\
      \ by\r\n• Reserve Bank of India \r\n• Securities and Exchange Board of India\r\
