    text: "Executive summary – Bajaj Finance\r\nMSME \r\nBusiness\r\n• Offers secured\
      \ & unsecured loans to MSME and self-employed professionals, to meet their working\
      \ capital and asset \r\nfinancing requirements. \r\n• Secured offerings inclue\
      \ enterprise loans against property, affordable housing loans and medical and\
      \ industrial equipment \r\nfinancing\r\n• Focused on affluent MSMEs with established\
      \ financials & demonstrated borrowing track record\r\n• The business operates\
      \ on a robust, data-driven underwriting model that leverages comprehensive banking\
      \ information\r\nGold Loan\r\n• Amongst top 5 gold loan lenders in NBFC sector\
      \ in India\r\n• Rapidly scaling Gold loan franchise — present at 1,701 branches\
      \ and will go to 2,700-2,800 by FY27\r\n• Wider branch, digital footprint, sharper\
      \ processes and customer-centric offerings drove a significant portfolio scale-up\r\
      \nWheels \r\nFinancing\r\n• Offers new and used car finance, tractor finance,\
      \ commercial vehicle finance to retail and corporate customers\r\n• New car\
      \ finance operational across 59 locations, covering over 3,000 dealers & 24\
      \ OEMs\r\n• Used car finance with increased focus on Sale Purchase (SP) financing\
      \ as against refinancing\r\n• Commercial vehicle finance caters LCV, MHCV category\r\
      \nCommercial \r\nBusiness\r\n• Offers short, medium and long-term financing\
      \ to mid market corporates\r\n• Focused on auto ancillaries, pharma, light engineering,\
      \ specialty chemicals, financial institution groups, lease rental \r\ndiscounting\
      \ and top mid-corporate clients in India\r\nMicrofinance \r\nBusiness\r\n• Small-ticket\
      \ group loans of ₹20,000–₹100,000 to women in low-income, largely unbanked households.\r\
      \n• Present across 11 states through 447 branches as of 30 June 2026\r\n• Portfolio\
      \ quality remains healthy with GNPA at 0.41% and NNPA at 0.07% as of 30 Jun\
      \ 2026\r\n31"
