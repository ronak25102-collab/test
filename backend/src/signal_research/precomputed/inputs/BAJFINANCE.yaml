    discovery_sentence: Bajaj Finance recorded a 0.51 percentage point increase in
      its MSME gross bad-loan ratio from September 2025 to September 2026 despite
      an improving consolidated ratio.
    why_it_matters:
    - text: An improving group bad-loan ratio can coexist with deterioration in a
        named product portfolio; the product-level disclosure changes the interpretation
        of aggregate asset quality.
