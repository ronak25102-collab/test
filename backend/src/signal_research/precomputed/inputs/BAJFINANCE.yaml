    extraction_quality: good
  - id: acc3b04c-3963-520f-9479-f45e17132737
    document_id: c3698902-e11b-53c7-94e6-ae12946fb064
    page_index: 5
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "Balance sheet and business metrics\r\n1. AUM was up 24% to ₹ 546,944 crore\
      \ as against ₹ 441,450 crore as of 30 June 2025.\r\n2. AUM grew by ₹ 36,969\
      \ crore in Q1 FY27.\r\n3. New loans booked grew by 20% to 16.13 MM in Q1 FY27\
      \ as against 13.49 MM in Q1 FY26. The Company expects to disburse\r\n60-62 MM\
      \ new loans in FY27.\r\nCustomer franchise and geographic footprint\r\n4. In\
      \ Q1, the Company added 5.10 MM customers to its franchise. The Company expects\
      \ to add 18-20 MM new customers to \r\nits franchise in FY27. \r\n5. Customer\
      \ franchise stood at 124.43 MM as of 30 June 2026. Cross sell franchise stood\
      \ at 79.22 MM.\r\n6. In Q1, the Company added 7.4K distribution points. Geographic\
      \ presence stood at 4,073 locations and active distribution \r\npoints were\
      \ over 250K as of 30 June 2026. The Company plans to open 150-175 new locations\
      \ in FY27.\r\n7. In Q1, the Company added 194 Gold Loan branches. BFL now has\
      \ 1,701 Gold loan and 447 MFI branches. The Company \r\nexpects to close FY27\
      \ with 2,700-2,800 Gold Loan branches and 520-550 MFI branches.\r\nLiquidity\
      \ and cost of funds\r\n8. Liquidity buffer stood at ₹ 17,847 crore as of 30\
      \ June 2026.\r\n9. In Q1, cost of funds was 7.40%, improving 1 bps over Q4 FY26.\
      \ \r\n10. Deposits book stood at ₹ 68,534 crore as of 30 June 2026. It contributed\
      \ to 15% of consolidated borrowings.\r\nLead financial indicators for Q1 FY27\
      \ – consolidated (1/3)\r\n6"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
  - id: 83b13591-7c21-5347-b7c8-92c8998c2c6a
    document_id: c3698902-e11b-53c7-94e6-ae12946fb064
    page_index: 6
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "Operating efficiencies\r\n11. Net interest income grew by 23% to ₹ 12,571\
      \ crore as against ₹ 10,228 crore in Q1 FY26. NIM remained steady in Q1.\r\n\
      12. Net total income grew by 22% to ₹ 15,224 crore as against ₹ 12,460 crore\
      \ in Q1 FY26.\r\n13. Opex to Net total income was 33.4% as against 33.1% in\
      \ Q1 FY26. The Company is confident of delivering 25-40 bps \r\nimprovement\
      \ in Opex to NTI in FY27\r\n14. Full-time employee count stood at 73,261 as\
      \ of 30 June 2026. The Company added 1,648 employees in Q1 FY27. Adjusted \r\
      \nfor Gold Loan and MFI, the net addition was 811. Employee attrition was 12.8\
      \ % in Q1 FY27.\r\n15. The Fixed Term Contract (FTC) resource count stood at\
      \ 86,301 as of 30 June 2026.\r\nCredit cost\r\n16. Loan losses and provisions\
      \ in Q1 FY27 was ₹ 1,993 crore as against ₹ 1,969 crore in Q1 FY26. Q1 FY27\
      \ includes a prudent \r\nmanagement and macro-economic provision of ₹ 296 crore.\
      \ Excluding this, loan losses and provisions were ₹ 1,697 crore, a \r\ndecline\
      \ of 14% as against Q1 FY26.\r\n17. Loan loss to average AUF was 1.54% in Q1\
      \ FY27 as against 1.87% in Q1 FY26. Excluding prudent management and macro\uFFFE\
      economic provision of ₹ 296 crore, it was 1.31% in Q1 FY27.\r\n18. In Q1, stage\
      \ 2 & 3 assets increased by ₹ 328 crore. Stage 2 assets increased by ₹ 206 crore\
      \ and stage 3 assets increased \r\nby ₹ 122 crore. The contribution of stage\
      \ 2 & 3 assets has reduced to 1.87% of loan from 1.94% in Q4 FY26.\r\n19. Vintage\
      \ credit performance across 3MOB, 6MOB and 9MOB continues to reflect significant\
      \ improvement. We are optimistic \r\nabout credit cost outlook for FY27. This\
      \ outlook remains contingent on no material adverse effects from geopolitical\
      \ \r\nevents. 7\r\nLead financial indicators for Q1 FY27 – consolidated (2/3)"
    character_start: null
    character_end: null
    extraction_method: pdfium
    extraction_quality: good
