      \ market products - Broking, Depositary services, Margin Trade Financing (MTF),\
      \ ESOP \r\nFinancing, IPOs and Distribution of Mutual Funds, PMS, and AIF. The\
      \ Company launched Commodity derivatives product \r\nfor its customer.\r\n•\
      \ Broking business caters to two different business segments – Branch and Retail\r\
      \n• AUM as of 30 September 2026 stood at ₹ 12,058 crore (MTF: ₹ 10,498 crore\
      \ and ESOP financing: ₹ 1,560 crore)\r\n• Net total income was ₹ 160 crore in\
      \ Q2 FY27\r\n• Profit after tax was ₹ 64 crore in Q2 FY27\r\nBranch Broking\r\
      \n• Business oriented towards delivering relationship-based broking solutions\
      \ to UHNI & HNI client segment\r\n• Focused on building MTF relationship. \r\
      \n• MTF book stood at ₹ 9,160 crore as of 30 September 2026\r\n• Present in\
      \ 43 locations as of 30 September 2026\r\n• Added 5K UHNI/HNI clients in Q2\
      \ FY27. Total client base stood at 100K as of 30 September 2026\r\nRetail Broking\r\
      \n• Added 116K trading and demat accounts in Q2 FY27 with focus to add accounts\
      \ with higher propensity to trade.\r\n• Total retail client base stood at 1.51\
      \ MM as of 30 September 2026\r\n• Crossed 1,700+ network of partners and affiliates\
