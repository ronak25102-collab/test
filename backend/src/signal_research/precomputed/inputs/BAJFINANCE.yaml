      \ as of 30 June 2025.\r\n21. The provisioning coverage ratio on stage 3 assets\
      \ was 60% in Q1 FY27.\r\nProfitability and capital\r\n21. Pre-provisioning operating\
      \ profit grew by 22% to ₹ 10,137 crore in Q1 FY27.\r\n22. Consolidated profit\
      \ before tax (PBT) grew by 28% to ₹ 8,149 crore in Q1 FY27. \r\n23. Consolidated\
      \ profit after tax (PAT) grew by 28% to ₹ 6,081 crore in Q1 FY27. \r\n24. In\
      \ Q1, company delivered annualised ROA of 4.7% as against 4.5% in Q1 FY26.\r\
      \n25. In Q1, company delivered annualised ROE of 20.4% as against 19.0% in Q1\
      \ FY26.\r\n26. Capital adequacy remained strong at 20.90% as of 30 June 2026.\
      \ Tier-1 capital was 20.01%.\r\n8\r\nLead financial indicators for Q1 FY27 –\
      \ consolidated (3/3)"
    character_start: null
    character_end: null
