      \ of 30 June 2026.\r\n4. In Q1, overall loan approvals were ₹ 34,463 crore as\
      \ against ₹ 22,973 crore in Q1 FY26.\r\n5. In Q1, disbursements were up by 33%\
      \ to ₹ 19,509 crore as against ₹ 14,651 crore in Q1 FY26.\r\n6. Geographic presence\
      \ stood at 182 locations.\r\nBHFL - Liquidity and cost of fund\r\n7. Liquidity\
