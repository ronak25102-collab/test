    column_label: null
    text: "An excellent quarter across all key metrics of AUM, new customer \r\naddition,\
      \ credit cost, profits, ROA and ROE. AUM grew by 24% to ₹ \r\n546,944 crore.\
      \ Delivered AUM addition of ₹ 36,969 crore. PBT grew \r\nby 28% to ₹ 8,149 crore.\
      \ Booked 16.13 MM new loans and added \r\n5.10 MM new customers in Q1. Customer\
      \ franchise stood at 124.43 \r\nMM. \r\n5\r\nOpex to Net \r\ntotal income\r\n\
      33.4%\r\nQ1 FY26\r\n33.1%\r\nNet NPA\r\n0.39%\r\nQ1 FY26\r\n0.50%\r\nROE\r\n\
      20.4%\r\nQ1 FY26\r\n19.0%\r\nPAT\r\nPre-minority interest\r\n₹ 6,081\r\nCr\r\
      \nGrowth\r\n28%\r\nAUM\r\n₹ 546,944\r\nCr\r\nGrowth\r\n24%\r\nPBT\r\n₹ 8,149\r\
      \nCr\r\nGrowth\r\n28%\r\nQ1 FY27 Executive summary - Consolidated\r\n* * *\r\
      \nAnnualised"
    character_start: null
    character_end: null
