    column_label: null
    text: "Executive summary – Bajaj Finance\r\nOverview\r\n• Focused on Consumer\
      \ Finance, Personal loans, MSME, Gold Loan, Wheels financing and Commercial\
      \ businesses.\r\n• Long-term strategy is to build a customer-centric company\
      \ serving all needs of the customer, leveraging technology and \r\nAI to drive\
      \ growth and efficiency and maintaining a strong risk culture to build a resilient\
      \ and sustainable company.\r\n• Focused on cross sell, customer experience and\
      \ product & process innovations to create a differentiated & profitable \r\n\
      business model\r\n• AUM of ₹ 426,879 crore as of 30 September 2026\r\n• AUM\
      \ mix as of 30 September 2026 – Urban : Rural : SME : Commercial : Mortgage\
      \ stood at 41% : 16% : 18% : 15% : 10%\r\n• Profit after tax of ₹ 5,536 crore\
      \ in Q2 FY27\r\n• Capital adequacy ratio (including Tier II capital) of 20.33%\
      \ as of 30 Sep 2026. Tier I capital stood at 19.43%\r\nConsumer\r\nFinance\r\
      \n• One of the largest consumer financing company in the country, offers financing\
      \ of consumer electronics, digital products, \r\ne-Commerce, two wheelers &\
      \ lifestyle products.\r\n• Our extensive distribution network, comprising over\
      \ 244K+ point of sale across 1,515 urban and 2,576 rural locations.\r\n• EMI\
      \ Card franchise stood at 100.38 MM cards in force (CIF) as of 30 September\
      \ 2026.\r\nPersonal \r\nLoans\r\n• Among the largest personal loan companies\
      \ in India, focused on pre-approved and salaried personal loan offerings.\r\n\
      • Continued focus on digital simplification, process automation and customer\
      \ journey enhancement is driving stronger \r\ncustomer engagement and improved\
      \ conversion rates.\r\n• AI driven voice initiatives and AI text bots generated\
      \ disbursement of ₹ 2,744 crore in Q2 FY27.\r\n28"
