    column_label: null
    text: "Balance sheet and business metrics\r\n1. AUM was up 22% to ₹ 484,477 crore\
      \ as of 31 December 2025.\r\n• AUM before the accelerated ECL provision grew\
      \ by 22% to ₹ 485,883 crore as of 31 December 2025 from ₹ 398,043 \r\ncrore\
      \ as of 31 December 2024. AUM increase in Q3 FY26 was ₹ 23,622 crore.\r\n2.\
      \ New loans booked were at 13.90 MM in Q3 FY26 as against 12.06 MM in Q3 FY25,\
      \ recording a growth of 15%. \r\nCustomer franchise and geographic footprint\r\
      \n3. In Q3, the Company added 4.76 MM customers to its franchise. The Company\
      \ expects to add 17-18 MM new customers to \r\nits franchise in FY26.\r\n4.\
      \ Customer franchise stood at 115.40 MM as of 31 December 2025. Cross sell franchise\
      \ stood at 73.84 MM.\r\n5. Geographic presence stood at 4,052 locations. \r\n\
      6. Active distribution points stood at 241K as of 31 December 2025.\r\nLiquidity\
      \ and cost of funds\r\n7. Liquidity buffer stood at ₹ 15,081 crore as of 31\
      \ December 2025.\r\n8. In Q3, cost of funds was 7.45%, an improvement of 7bps\
      \ over Q2 FY26. Cost of funds is expected to be 7.55%-7.60% in \r\nFY26. \r\n\
      9. Deposits book stood at ₹ 71,037 crore as of 31 December 2025. Deposits contributed\
      \ to 17% of consolidated borrowings as \r\nof 31 December 2025. \r\n6\r\nLead\
      \ financial indicators – Q3 FY26 (1/3)"
    character_start: null
    character_end: null
