  - id: 92432474-dbc6-520a-ad08-4b05d278623f
    document_id: 2d6728ef-b85c-50b3-8aea-a0c966df5801
    page_index: 11
    printed_page_label: null
    section: null
    table_id: null
    row_label: null
    column_label: null
    text: "11\r\nFINAI transformation update (3/3)\r\n1. Data Intelligence \r\n• The\
      \ Company is on course to define data architecture for AI by Q4 FY26. \r\n•\
      \ In FY27, to enable intelligent capabilities, the Company will implement and\
      \ scale data for AI-including feature marts, \r\nembeddings and data annotation\
      \ across voice, text, video, images, unstructured data, and knowledge graphs.\r\
      \n2. Consumer AI\r\n• Over next 6 months, 22 business journeys and 2 service\
      \ journeys will be re-architected and AI injections like AI \r\nsummary, AI\
      \ in-page search, document scan via AI vision will be live on current digital\
      \ platforms. \r\n• In FY27, the Company will enable AI injections across the\
      \ App & Website for all business and service journeys. \r\n• In FY27, the Company\
      \ will enable discovery across leading AI platforms such as ChatGPT and Gemini.\
      \ \r\n• In FY27, the Company will also build a new consumer AI platform with\
      \ “Explore” as a core capability for all businesses \r\nand service journeys.\
      \ \r\n3. Agentic AI\r\n• The Company is on course to build the multi-agent platform,\
      \ with the first 25 autonomous agents going live to support \r\npriority enterprise\
      \ functions. This will be implemented by Q4 FY26. \r\n• In FY27, the Company\
      \ will progressively scale its Agentic AI capabilities by implementing 800+\
      \ autonomous agents \r\nacross sales, operations, DMS, HR, IT, and Risk."
    character_start: null
    character_end: null
