    text: "Operating efficiencies\r\n10. Net interest income grew by 21% to ₹ 11,317\
      \ crore as against ₹ 9,382 crore in Q3 FY25. NIM remained steady.\r\n11. Net\
      \ total income (NTI) grew by 19% to ₹ 13,875 crore as against ₹ 11,673 crore\
      \ in Q3 FY25.\r\n12. Opex to NTI improved to 32.8% as against 33.1% in Q3 FY25.\
      \ AI implementation across businesses is accelerating and \r\nshould continue\
      \ to result in improvement in operating efficiencies.\r\n13. Full-time employee\
      \ count stood at 69,824 (BFL, BHFL & BFSL) as of 31 December 2025. The Company\
      \ added 2,363\r\nemployees in Q3 FY26. Annualised employee attrition as of 31\
      \ December 2025 was 18.2%.\r\n14. Fixed Term Contract (FTC) resource count stood\
      \ at 78,093 as of 31 December 2025.\r\nCredit cost\r\n15. Loan losses and provisions\
      \ in Q3 FY26 was ₹ 3,625 crore. \r\n• Loan losses and provisions before accelerated\
      \ ECL provision of ₹ 1,406 crore was ₹ 2,219 crore in Q3 FY26 as against ₹ \r\
      \n2,043 crore in Q3 FY25, an increase of 9%.\r\n16. Annualised loan loss to\
      \ average AUF before accelerated ECL provision was 1.91% in Q3 FY26 vs 2.16%\
      \ in Q3 FY25.\r\n17. In Q3, net decrease in stage 2 & 3 assets was ₹ 93 crore.\
      \ Stage 2 assets decreased by ₹ 287 crore and stage 3 assets \r\nincreased by\
      \ ₹ 194 crore reflecting significant improvement in portfolio quality and outlook\
      \ on credit cost.\r\n18. Vintage credit performance across 3MOB, 6MOB and 9MOB\
      \ has improved significantly. We are optimistic about credit cost \r\noutlook\
      \ for FY27.\r\n7\r\nLead financial indicators – Q3 FY26 (2/3)"
