    column_label: null
    text: "FINAI transformation update (1/5)\r\n# Stage Metric UoM Q2 FY26 Q1 FY27\
      \ Q2 FY27 YoY\r\n1 People\r\nDedicated employees working in AI unit # as of\
      \ 121 230 328 171%\r\nAI text BOT for employees # as of - 25 39 -\r\n2 Data\
      \ for AI\r\nVoice to Data conversion for all customer \r\ninteractions # MM\
