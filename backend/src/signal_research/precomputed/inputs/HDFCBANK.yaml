  exact_passage: 'NEWS RELEASE HDFC BANK LIMITED,

    Sandoz House, Shivsagar Estate,

    Dr. Annie Besant Road, Worli,

    Mumbai - 400 018.

    CIN: L65920MH1994PLC080618

    HDFC Bank Limited

    FINANCIAL RESULTS (INDIAN GAAP) FOR THE QUARTER AND HALF YEAR

    ENDED SEPTEMBER 30, 2026

    The Board of Directors of HDFC Bank Limited approved the Bank’s (Indian GAAP) results

    for the quarter ended September 30, 2026, at its meeting held in Mumbai on Saturday,

    October 17, 2026. The accounts have been subjected to a ''Limited Review'' by the

    statutory auditors of the Bank.

    STANDALONE FINANCIAL RESULTS:

    Profit & Loss Account: Quarter ended September 30, 2026

    The Bank’s net revenue was ₹ 484.5 billion for the quarter ended September 30, 2026,

    as against ₹ 459.0 billion for the quarter ended September 30, 2025.

    Net interest income (interest earned less interest expended) for the quarter ended

    September 30, 2026 grew by 9.7% to ₹ 346.2 billion from ₹ 315.5 billion for the quarter

    ended September 30, 2025. Net interest margin was at 3.16% on total assets, and 3.32%

    based on interest earning assets.

    Other income (non-interest revenue) for the quarter ended September 30, 2026 was ₹

    138.3 billion. The four components of other income for the quarter ended September 30,

    2026 were fees & commissions of ₹ 96.9 billion (₹ 88.4 billion in the corresponding quarter

    of the previous year), foreign exchange & derivatives revenue of ₹ 15.5 billion (₹ 15.9

    billion in the corresponding quarter of the previous year), treasury trading gains of ₹ 7.8

    billion (₹ 23.9 billion in the corresponding quarter of the previous year) and miscellaneous

    income, including recoveries and dividend of ₹ 18.1 billion (₹ 15.3 billion in the

    corresponding quarter of the previous year).

    Operating expenses for the quarter ended September 30, 2026 were ₹ 189.7 billion, as

    against ₹ 179.8 billion during the corresponding quarter of the previous year. The cost-

    to-income ratio for the quarter was at 39.1%.

    Provisions and contingencies for the quarter ended September 30, 2026 were ₹ 35.7

    billion. The total credit cost ratio was at 0.44% for the quarter ended September 30, 2026.

    Regd. Office: HDFC Bank Limited, HDFC Bank House, Senapati Bapat Marg, Lower Parel (West), Mumbai - 400 013'
