    FINANCIAL RESULTS (INDIAN GAAP) FOR THE QUARTER AND YEAR ENDED

    MARCH 31, 2026

    The Board of Directors of HDFC Bank Limited approved the Bank’s (Indian GAAP) results

    for the quarter and year ended March 31, 2026, at its meeting held in Mumbai on

    Saturday, April 18, 2026. The accounts have been subjected to an audit by the statutory

    auditors of the Bank.

    STANDALONE FINANCIAL RESULTS:

    Summary for the Financial Year ended March 31, 2026

    Net revenues (net interest income plus other income) for the year ended March 31, 2026

    were ₹ 1,912.2 billion, as against ₹ 1,683.0 billion for the year ended March 31, 2025.

    Profit after tax for the year ended March 31, 2026 was ₹ 746.7 billion, up by 10.9% over

    the corresponding year ended March 31, 2025.

    Profit & Loss Account: Quarter ended March 31, 2026

    The Bank’s net revenue grew by 5.0% to ₹ 462.8 billion for the quarter ended March 31,

    2026 from ₹ 440.9 billion for the quarter ended March 31, 2025.

    Net interest income (interest earned less interest expended) for the quarter ended March

    31, 2026 grew by 3.2% to ₹ 330.8 billion from ₹ 320.7 billion for the quarter ended March

    31, 2025. Net interest margin was at 3.38% on total assets, and 3.53% based on interest

    earning assets.

    Other income (non-interest revenue) for the quarter ended March 31, 2026 was ₹ 132.0

    billion. The four components of other income for the quarter ended March 31, 2026 were

    fees & commissions of ₹ 92.2 billion (₹ 85.3 billion in the corresponding quarter of the

    previous year), foreign exchange & derivatives revenue of ₹ 14.9 billion (₹ 14.4 billion in

    the corresponding quarter of the previous year), net trading and mark to market gain of

    ₹ 8.2 billion (₹ 3.9 billion in the corresponding quarter of the previous year) and

    miscellaneous income, including recoveries and dividend of ₹ 16.7 billion (₹ 16.7 billion

    in the corresponding quarter of the previous year).

