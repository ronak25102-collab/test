[project]
name = "signal-research"
version = "0.1.0"
description = "Auditable autonomous financial research for Track A"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pdfplumber>=0.11,<1",
  "defusedxml>=0.7,<1",
  "typer>=0.12,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "openai>=2,<3",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
  "pypdfium2>=4,<6",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
ocr = ["tesserocr>=2.8,<3"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
signal-research = "signal_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/signal_research"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "UP"]
